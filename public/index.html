<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portal</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0a0a;color:#e0e0e0;font-family:monospace;display:flex;flex-direction:column;height:100vh;overflow:hidden}
#top{display:flex;flex:1;overflow:hidden}
#sidebar{width:180px;background:#111;border-right:1px solid #222;padding:10px;overflow-y:auto;flex-shrink:0}
#sidebar h2{font-size:10px;color:#555;margin-bottom:8px}
.dev-entry{padding:7px;border-radius:4px;cursor:pointer;margin-bottom:5px;background:#1a1a1a;border:1px solid #222;font-size:10px}
.dev-entry.active{border-color:#4af;background:#112}
.dev-entry .model{color:#ccc;font-weight:bold}
#main{flex:1;display:flex;flex-direction:column;overflow:hidden}
#screenWrap{flex:1;display:flex;align-items:center;justify-content:center;background:#050505;position:relative;overflow:hidden}
#screen{max-width:100%;max-height:100%;display:block;cursor:crosshair}
#empty{color:#222;font-size:12px}
#controls{background:#111;border-top:1px solid #222;padding:8px;display:flex;gap:6px;flex-wrap:wrap;justify-content:center;flex-shrink:0}
.btn{background:#1a1a1a;border:1px solid #333;color:#ccc;padding:6px 14px;border-radius:4px;cursor:pointer;font-family:monospace;font-size:11px}
.btn:active{background:#223;border-color:#4af}
#status{font-size:9px;color:#444;text-align:center;padding:3px}
#swipeHint{position:absolute;top:6px;left:6px;font-size:9px;color:#333;pointer-events:none}
</style>
</head>
<body>
<div id="top">
  <div id="sidebar">
    <h2>DEVICES</h2>
    <div id="devList"></div>
  </div>
  <div id="main">
    <div id="screenWrap">
      <img id="screen" style="display:none">
      <div id="empty">no device selected</div>
      <div id="swipeHint">tap to click · drag to swipe</div>
    </div>
    <div id="controls">
      <button class="btn" onclick="send({cmd:'back'})">◀ Back</button>
      <button class="btn" onclick="send({cmd:'home'})">⬤ Home</button>
      <button class="btn" onclick="send({cmd:'recent'})">▣ Recents</button>
      <button class="btn" onclick="send({cmd:'notif'})">🔔 Notifs</button>
    </div>
    <div id="status">disconnected</div>
  </div>
</div>
<script>
const proto  = location.protocol==='https:'?'wss':'ws';
const ws     = new WebSocket(`${proto}://${location.host}/portal`);
const devList= document.getElementById('devList');
const screen = document.getElementById('screen');
const empty  = document.getElementById('empty');
const status = document.getElementById('status');
let activeId = null;
let imgW=0,imgH=0,devW=1080,devH=1920;

ws.binaryType='blob';
ws.onopen=()=>status.textContent='connected';
ws.onclose=()=>status.textContent='disconnected';
ws.onmessage=(ev)=>{
  if(ev.data instanceof Blob){
    const url=URL.createObjectURL(ev.data);
    screen.onload=()=>{
      imgW=screen.clientWidth; imgH=screen.clientHeight;
      URL.revokeObjectURL(url);
    };
    screen.src=url;
    screen.style.display='block';
    empty.style.display='none';
  } else {
    const msg=JSON.parse(ev.data);
    if(msg.type==='device_list') renderDevices(msg.devices);
    if(msg.type==='screen_size'){devW=msg.w;devH=msg.h;}
  }
};

// ── tap and swipe ──────────────────────────────────────────────────────
let touchStart=null;
screen.addEventListener('mousedown', e=>{
  const r=screen.getBoundingClientRect();
  touchStart={x:e.clientX-r.left, y:e.clientY-r.top, t:Date.now()};
});
screen.addEventListener('mouseup', e=>{
  if(!touchStart) return;
  const r=screen.getBoundingClientRect();
  const ex=e.clientX-r.left, ey=e.clientY-r.top;
  const dx=ex-touchStart.x, dy=ey-touchStart.y;
  const dist=Math.sqrt(dx*dx+dy*dy);
  const scaleX=devW/r.width, scaleY=devH/r.height;
  if(dist<10){
    send({cmd:'tap',
      x:(touchStart.x*scaleX),
      y:(touchStart.y*scaleY)});
  } else {
    send({cmd:'swipe',
      x1:touchStart.x*scaleX, y1:touchStart.y*scaleY,
      x2:ex*scaleX, y2:ey*scaleY,
      dur:Math.min(Date.now()-touchStart.t,1000)});
  }
  touchStart=null;
});

// touch support for mobile viewing
screen.addEventListener('touchstart', e=>{
  e.preventDefault();
  const r=screen.getBoundingClientRect();
  const t=e.touches[0];
  touchStart={x:t.clientX-r.left,y:t.clientY-r.top,t:Date.now()};
},{passive:false});
screen.addEventListener('touchend', e=>{
  if(!touchStart) return;
  const r=screen.getBoundingClientRect();
  const t=e.changedTouches[0];
  const ex=t.clientX-r.left, ey=t.clientY-r.top;
  const dx=ex-touchStart.x, dy=ey-touchStart.y;
  const dist=Math.sqrt(dx*dx+dy*dy);
  const scaleX=devW/r.width, scaleY=devH/r.height;
  if(dist<10){
    send({cmd:'tap',x:touchStart.x*scaleX,y:touchStart.y*scaleY});
  } else {
    send({cmd:'swipe',
      x1:touchStart.x*scaleX,y1:touchStart.y*scaleY,
      x2:ex*scaleX,y2:ey*scaleY,
      dur:Math.min(Date.now()-touchStart.t,1000)});
  }
  touchStart=null;
},{passive:false});

function send(obj){ ws.send(JSON.stringify({type:'cmd',...obj})); }

function renderDevices(devs){
  devList.innerHTML='';
  if(!devs.length){
    devList.innerHTML='<div style="color:#333;font-size:10px">no devices</div>';
    return;
  }
  devs.forEach(d=>{
    const el=document.createElement('div');
    el.className='dev-entry'+(d.id===activeId?' active':'');
    el.innerHTML=`<div class="model">${d.model}</div>`;
    el.onclick=()=>watchDevice(d.id,el);
    devList.appendChild(el);
  });
}

function watchDevice(id,el){
  activeId=id;
  document.querySelectorAll('.dev-entry').forEach(e=>e.classList.remove('active'));
  el.classList.add('active');
  ws.send(JSON.stringify({type:'watch',id}));
}
</script>
</body>
</html>
